<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A4 Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e5e5e5;
      font-family: Arial, sans-serif;
    }

    .a4-page {
      width: 595px;
      height: 842px;
      margin: 20px auto;
      background-image: url(./img/pdf_cover.png);
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      display: flex;
    flex-direction: column;
    justify-content: flex-end;
    }
    .dark_box {
      display: flex;
width: 100%;
padding: 40px 48px;
padding-bottom: 82px;
flex-direction: column;
align-items: center;
gap: 8px;
background: var(--brand-ink-glass-62, rgba(12, 20, 40, 0.62));
    }
    .dark_box h1 {
      margin-bottom: 0px;
      color: var(--brand-cream, #F3EEE4);
text-align: center;

/* heading/h3 */
font-family: Newsreader;
font-size: 32px;
font-style: normal;
font-weight: 400;
line-height: 128%; /* 40.96px */
    }
    .dark_box h2 {
      margin-bottom: 0px;
      color: var(--brand-gold, #E3AC5A);
text-align: center;

/* body / medium */
font-family: Figtree;
font-size: 17px;
font-style: normal;
font-weight: 500;
line-height: 140%; /* 23.8px */
    }
    .dark_box h3 {
      margin-bottom: 0px;
      color: var(--brand-cream-muted-55, rgba(243, 238, 228, 0.55));
text-align: center;

/* body / eyebrow */
font-family: Figtree;
font-size: 12px;
font-style: normal;
font-weight: 600;
line-height: 140%; /* 16.8px */
letter-spacing: 2px;
text-transform: uppercase;
    }

    @media print {
      body {
        background: #fff;
      }

      .a4-page {
        width: 595px;
        height: 842px;
        margin: 0;
        overflow: hidden;
      }

      @page {
        size: A4;
        margin: 0;
      }
    }
  </style>
</head>

<body>

  <div class="a4-page">

    <div class="dark_box">
      <h1>The Lost Sky Island</h1>
      <h2>A story for Theo</h2>
      <h3>TWINKLE YOUR TALE</h3>
    </div>


  </div>

</body>

</html>
