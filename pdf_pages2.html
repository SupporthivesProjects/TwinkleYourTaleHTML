<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A4 Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e5e5e5;
      font-family: Arial, sans-serif;
    }

    .a4-page {
        background: var(--brand-cream, #F3EEE4);
      margin: 20px auto;
      display: flex;
width: 595px;
height: 842px;
padding: 64px 64px 56px 64px;
flex-direction: column;
justify-content: space-between;
align-items: center;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }
    .last_pp {
        color: var(--brand-stone, #6B6656);
text-align: center;

/* body / eyebrow */
font-family: Figtree;
font-size: 12px;
font-style: normal;
font-weight: 600;
line-height: 140%; /* 16.8px */
letter-spacing: 2px;
text-transform: uppercase;
margin-bottom: 0px;
align-self: stretch;
    }
    .top_a4 {
        display: flex;
flex-direction: column;
align-items: center;
gap: 44px;
align-self: stretch;
    }
    .top_a4 h4 {
        color: var(--brand-ink, #0C1428);
text-align: center;

/* body / large */
font-family: Figtree;
font-size: 20px;
font-style: normal;
font-weight: 400;
line-height: 155%; /* 31px */
align-self: stretch;
margin-bottom: 0px;
    }
    .a4_photodiv {
            width: 100%;
            height: 380px;
            background-image: url(./img/second_page_bg.png);
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }

    @media print {
      body {
        background: #fff;
      }

      .a4-page {
        width: 595px;
        height: 842px;
        margin: 0;
        overflow: hidden;
      }

      @page {
        size: A4;
        margin: 0;
      }
    }
  </style>
</head>

<body>

  <div class="a4-page">
    <div class="top_a4">
        <div class="a4_photodiv">

        </div>
        <h4>
            The lantern in his hand would not go out, however hard the wind pulled at it. That was how he knew the way was still open.
        </h4>
    </div>

    <p class="last_pp">TWINKLE YOUR TALE</p>


  </div>

</body>

</html>
